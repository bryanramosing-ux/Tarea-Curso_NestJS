# Base de datos local del proyecto.
# Lee las credenciales del MISMO .env que usa la aplicación (sin valores por
# defecto: si falta una variable, Compose falla en lugar de inventarla).
services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in .env}
    ports:
      # Solo accesible desde esta máquina (no se expone a la red local).
      - "127.0.0.1:${DB_PORT:?DB_PORT is required in .env}:5432"
    volumes:
      - kanban-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kanban-postgres-data:
